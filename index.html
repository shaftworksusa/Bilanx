<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S2000 Build Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>S2000 Build Tracker</h1>
      <span id="carLabel" class="muted"></span>
    </div>
    <div class="odo">
      <label for="odometer">Odometer (mi)</label>
      <input id="odometer" type="number" min="0" step="1">
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="parts">Parts</button>
    <button data-tab="maintenance">Maintenance</button>
    <button data-tab="log">Mod Log</button>
    <button data-tab="todo">To-Do</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <main>
    <!-- Dashboard -->
    <section id="dashboard" class="tab active">
      <div class="stats" id="stats"></div>
      <div class="grid2">
        <div class="card">
          <h2>Maintenance due</h2>
          <ul id="dueList" class="plain"></ul>
        </div>
        <div class="card">
          <h2>Spend by category</h2>
          <div id="catBars"></div>
        </div>
        <div class="card">
          <h2>Open to-dos</h2>
          <ul id="dashTodos" class="plain"></ul>
        </div>
        <div class="card">
          <h2>Recent log</h2>
          <ul id="dashLog" class="plain"></ul>
        </div>
      </div>
    </section>

    <!-- Parts -->
    <section id="parts" class="tab">
      <form id="partForm" class="card form">
        <input type="hidden" name="id">
        <input name="name" placeholder="Part name" required>
        <select name="category"></select>
        <input name="brand" placeholder="Brand">
        <input name="vendor" placeholder="Vendor">
        <input name="partNo" placeholder="Part #">
        <input name="cost" type="number" step="0.01" min="0" placeholder="Cost ($)">
        <select name="status">
          <option value="planned">Planned</option>
          <option value="ordered">Ordered</option>
          <option value="received">Received</option>
          <option value="installed">Installed</option>
        </select>
        <input name="link" type="url" placeholder="Link (optional)">
        <input name="notes" placeholder="Notes" class="wide">
        <div class="actions">
          <button type="submit">Save part</button>
          <button type="button" class="ghost" data-reset>Clear</button>
        </div>
      </form>
      <div class="toolbar">
        <input id="partSearch" placeholder="Search parts…">
        <select id="partFilter"><option value="">All statuses</option><option>planned</option><option>ordered</option><option>received</option><option>installed</option></select>
      </div>
      <div class="table-wrap"><table id="partTable"></table></div>
    </section>

    <!-- Maintenance -->
    <section id="maintenance" class="tab">
      <form id="maintForm" class="card form">
        <input type="hidden" name="id">
        <input name="name" placeholder="Service item" required>
        <input name="intervalMiles" type="number" min="0" placeholder="Every (mi)">
        <input name="intervalMonths" type="number" min="0" placeholder="Every (months)">
        <input name="lastMiles" type="number" min="0" placeholder="Last done (mi)">
        <input name="lastDate" type="date" title="Last done (date)">
        <input name="notes" placeholder="Spec / notes" class="wide">
        <div class="actions">
          <button type="submit">Save item</button>
          <button type="button" class="ghost" data-reset>Clear</button>
        </div>
      </form>
      <div class="table-wrap"><table id="maintTable"></table></div>
    </section>

    <!-- Mod Log -->
    <section id="log" class="tab">
      <form id="logForm" class="card form">
        <input type="hidden" name="id">
        <input name="date" type="date" required>
        <input name="miles" type="number" min="0" placeholder="Odometer">
        <input name="title" placeholder="What was done" required class="wide">
        <input name="cost" type="number" step="0.01" min="0" placeholder="Extra cost ($)">
        <input name="hours" type="number" step="0.25" min="0" placeholder="Hours">
        <textarea name="notes" placeholder="Details, torque specs, lessons learned…" class="wide"></textarea>
        <div class="actions">
          <button type="submit">Save entry</button>
          <button type="button" class="ghost" data-reset>Clear</button>
        </div>
      </form>
      <div id="logList"></div>
    </section>

    <!-- To-Do -->
    <section id="todo" class="tab">
      <form id="todoForm" class="card form inline">
        <input name="text" placeholder="Add a task…" required class="wide">
        <select name="priority"><option value="2">Normal</option><option value="1">High</option><option value="3">Low</option></select>
        <button type="submit">Add</button>
      </form>
      <ul id="todoList" class="todos"></ul>
    </section>

    <!-- Settings -->
    <section id="settings" class="tab">
      <form id="carForm" class="card form">
        <h2 class="wide">Car</h2>
        <input name="year" type="number" placeholder="Year">
        <select name="chassis"><option value="AP1">AP1 (2000–03, F20C)</option><option value="AP2">AP2 (2004–09, F22C1)</option></select>
        <input name="color" placeholder="Color">
        <input name="vin" placeholder="VIN">
        <input name="budget" type="number" min="0" step="1" placeholder="Build budget ($)">
        <input name="goal" placeholder="Build goal (e.g. street / track)" class="wide">
        <div class="actions"><button type="submit">Save</button></div>
      </form>
      <div class="card">
        <h2>Data</h2>
        <p class="muted">Everything is stored in this browser. Export a backup regularly.</p>
        <div class="actions">
          <button id="exportBtn">Export JSON</button>
          <label class="button ghost">Import JSON<input id="importFile" type="file" accept="application/json" hidden></label>
          <button id="exportCsv" class="ghost">Export parts CSV</button>
          <button id="mergeSeed" class="ghost" title="Add items from seed.js that are not already here">Merge project data</button>
          <button id="resetBtn" class="danger">Reset to defaults</button>
        </div>
      </div>
    </section>
  </main>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
